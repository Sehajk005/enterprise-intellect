[project]
name = "enterprise-intellect-backend"
version = "0.1.0"
description = "Enterprise Intellect V2 backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "sqlalchemy[asyncio]>=2",
  "asyncpg",
  "alembic",
  "argon2-cffi",
  "pyjwt",
  "google-genai",
  "pinecone",
  "pypdf",
  "python-docx",
  "filetype",
  "slowapi",
  "httpx",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
  "mypy",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  "integration: needs the Compose Postgres (docker compose up -d db)",
]
